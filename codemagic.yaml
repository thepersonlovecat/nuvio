workflows:
  ios-unsigned-build:
    name: Build Nuvio iOS (Unsigned IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      java: 17
    scripts:
      - name: Chuẩn bị MPVKit và Kotlin Multiplatform Core
        script: |
          echo "=== 1. Chuẩn bị MPVKit Package ==="
          if [ ! -d "../MPVKit" ]; then
            echo "Cloning MPVKit into ../MPVKit..."
            git clone --depth 1 https://github.com/NuvioMedia/MPVKit.git ../MPVKit
          fi

          echo "=== 2. Chuẩn bị ComposeApp & Gradle Build Core ==="
          if [ ! -d "/tmp/NuvioMobile" ]; then
            echo "Tải riêng KMP Core cần cho iOS từ NuvioMobile (branch cmp-rewrite)..."
            git clone --depth 1 --filter=blob:none --sparse --branch cmp-rewrite https://github.com/NuvioMedia/NuvioMobile.git /tmp/NuvioMobile
            git -C /tmp/NuvioMobile sparse-checkout set --no-cone \
              /gradle/ /gradlew /gradlew.bat /gradle.properties /build.gradle.kts /settings.gradle.kts /composeApp/
          fi

          echo "Sao chép các thành phần Gradle và KMP..."
          cp -r /tmp/NuvioMobile/gradle* ../
          cp -r /tmp/NuvioMobile/build.gradle.kts ../
          cp -r /tmp/NuvioMobile/settings.gradle.kts ../
          cp -r /tmp/NuvioMobile/composeApp ../
          chmod +x ../gradlew

          echo "Cấu hình settings.gradle.kts cho iOS..."
          python3 -c "p='../settings.gradle.kts'; c=open(p).read(); open(p,'w').write(c.replace('include(\":androidApp\")','// include(\":androidApp\")'))"

          echo "Đồng bộ Configuration sang ../iosApp cho Gradle..."
          mkdir -p ../iosApp
          cp -r Configuration ../iosApp/

          echo "Cấu hình tài khoản Nuvio (Supabase Backend) vào local.properties..."
          cat << 'EOF' > ../local.properties
NUVIO_SUPABASE_URL=https://api.nuvio.tv
NUVIO_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI
NUVIO_SUPABASE_FALLBACK_URL=https://api.nuvio.tv
SUPPORTERS_WALL_URL=https://nuvio.tv/api/supporters/wall
EOF
          cp ../local.properties local.properties
          export NUVIO_SUPABASE_URL="https://api.nuvio.tv"
          export NUVIO_SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI"
          export NUVIO_SUPABASE_FALLBACK_URL="https://api.nuvio.tv"

          echo "Vô hiệu hóa các pha tối ưu Kotlin/Native gây OOM khi link Release..."
          python3 << 'EOF'
          path = '../composeApp/build.gradle.kts'
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          target = 'freeCompilerArgs += listOf("-Xbinary=bundleId=$iosFrameworkBundleId")'
          replacement = '''freeCompilerArgs += listOf(
                "-Xbinary=bundleId=$iosFrameworkBundleId",
                // Whole-program optimizations can exceed the memory available to the CI linker.
                "-Xdisable-phases=DevirtualizationAnalysis",
                "-Xdisable-phases=EscapeAnalysis",
                "-Xdisable-phases=RemoveRedundantCallsToStaticInitializersPhase",
                "-Xadd-light-debug=disable",
            )'''

          if target in content:
              content = content.replace(target, replacement)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print("==> Đã vá thành công các pha Kotlin/Native gây OOM")
          else:
              print("==> CẢNH BÁO: Không tìm thấy target trong composeApp/build.gradle.kts!")
          EOF

          echo "Cấu hình 6GB RAM cho Gradle và tiến trình Kotlin/Native..."
          python3 << 'EOF'
          path = '../gradle.properties'
          with open(path, 'r', encoding='utf-8') as f:
              lines = f.read().splitlines()

          filtered = [l for l in lines if not any(l.startswith(k) for k in [
              'org.gradle.jvmargs',
              'kotlin.daemon.jvmargs',
              'kotlin.native.jvmargs',
              'kotlin.native.jvmArgs',
              'kotlin.native.cacheKind'
          ])]

          filtered.append('org.gradle.jvmargs=-Xmx6144m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m')
          filtered.append('kotlin.daemon.jvmargs=-Xmx6144m')
          # Kotlin/Native linking runs in a separate JVM; this exact camel-case key configures it.
          filtered.append('kotlin.native.jvmArgs=-Xmx6144m -XX:+UseG1GC -XX:MaxMetaspaceSize=1024m')

          with open(path, 'w', encoding='utf-8') as f:
              f.write('\n'.join(filtered) + '\n')
          print("==> Đã cập nhật xong gradle.properties")
          EOF
          
          # Đồng bộ sang cả ~/.gradle/gradle.properties toàn cục
          mkdir -p ~/.gradle
          cp ../gradle.properties ~/.gradle/gradle.properties

          echo "=== 3. Kiểm tra môi trường thư mục cha ==="
          ls -la ../
          cat ../gradle.properties

      - name: Build Archive Xcode (Không cần Chứng chỉ - Unsigned)
        script: |
          echo "=== Bắt đầu biên dịch Xcode Archive (Unsigned) ==="
          
          # Thiết lập JAVA_HOME cho Gradle
          if [ -z "$JAVA_HOME" ]; then
            export JAVA_HOME=$(/usr/libexec/java_home -v 17 2>/dev/null || echo "/opt/homebrew/opt/openjdk@17")
          fi
          export PATH="$JAVA_HOME/bin:$PATH"

          # Thiết lập biến môi trường cấp phát 6GB RAM tối ưu cho Mac mini
          export GRADLE_OPTS="-Xmx6144M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m"
          export KOTLIN_DAEMON_JVMARGS="-Xmx6144M"
          export NUVIO_SUPABASE_URL="https://api.nuvio.tv"
          export NUVIO_SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI"
          export NUVIO_SUPABASE_FALLBACK_URL="https://api.nuvio.tv"

          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Nuvio.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Đóng gói thành file Unsigned IPA
        script: |
          echo "=== Đóng gói IPA ==="
          mkdir -p build/Payload
          cp -r build/Nuvio.xcarchive/Products/Applications/Nuvio.app build/Payload/
          cd build
          zip -qr Nuvio-unsigned.ipa Payload
          echo "=== Đã tạo thành công Nuvio-unsigned.ipa ==="
          ls -lh Nuvio-unsigned.ipa

    artifacts:
      - build/*.ipa
