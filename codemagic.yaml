workflows:
  ios-unsigned-build:
    name: Build Nuvio iOS (Unsigned IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      java: 17
    scripts:
      - name: Chuẩn bị MPVKit và Kotlin Multiplatform Core
        script: |
          echo "=== 1. Chuẩn bị MPVKit Package ==="
          if [ ! -d "../MPVKit" ]; then
            echo "Cloning MPVKit into ../MPVKit..."
            git clone --depth 1 https://github.com/NuvioMedia/MPVKit.git ../MPVKit
          fi

          echo "=== 2. Chuẩn bị ComposeApp & Gradle Build Core ==="
          if [ ! -f "../gradlew" ] || [ ! -d "../composeApp" ]; then
            echo "Tải KMP Core từ NuvioMobile (branch cmp-rewrite)..."
            rm -rf /tmp/NuvioMobile
            git clone --depth 1 --branch cmp-rewrite https://github.com/NuvioMedia/NuvioMobile.git /tmp/NuvioMobile
            
            cp -r /tmp/NuvioMobile/gradle* ../
            cp -r /tmp/NuvioMobile/build.gradle.kts ../
            cp -r /tmp/NuvioMobile/settings.gradle.kts ../
            cp -r /tmp/NuvioMobile/composeApp ../
            chmod +x ../gradlew
          fi

          echo "=== 3. Kiểm tra môi trường thư mục cha ==="
          ls -la ../

      - name: Build Archive Xcode (Không cần Chứng chỉ - Unsigned)
        script: |
          echo "=== Bắt đầu biên dịch Xcode Archive (Unsigned) ==="
          
          # Thiết lập JAVA_HOME cho Gradle nếu chưa có
          if [ -z "$JAVA_HOME" ]; then
            export JAVA_HOME=$(/usr/libexec/java_home -v 17 2>/dev/null || echo "/opt/homebrew/opt/openjdk@17")
          fi
          export PATH="$JAVA_HOME/bin:$PATH"

          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Nuvio.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Đóng gói thành file Unsigned IPA
        script: |
          echo "=== Đóng gói IPA ==="
          mkdir -p build/Payload
          cp -r build/Nuvio.xcarchive/Products/Applications/Nuvio.app build/Payload/
          cd build
          zip -qr Nuvio-unsigned.ipa Payload
          echo "=== Đã tạo thành công Nuvio-unsigned.ipa ==="
          ls -lh Nuvio-unsigned.ipa

    artifacts:
      - build/*.ipa
      - build/*.xcarchive
