workflows:
  ios-unsigned-build:
    name: Build Nuvio iOS (Unsigned IPA)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      java: 17
    scripts:
      - name: Chuẩn bị MPVKit và Kotlin Multiplatform Core
        script: |
          echo "=== 1. Chuẩn bị MPVKit Package ==="
          if [ ! -d "../MPVKit" ]; then
            echo "Cloning MPVKit into ../MPVKit..."
            git clone --depth 1 https://github.com/NuvioMedia/MPVKit.git ../MPVKit
          fi

          echo "=== 2. Chuẩn bị ComposeApp & Gradle Build Core ==="
          if [ ! -d "/tmp/NuvioMobile" ]; then
            echo "Tải KMP Core từ NuvioMobile (branch cmp-rewrite)..."
            git clone --depth 1 --branch cmp-rewrite https://github.com/NuvioMedia/NuvioMobile.git /tmp/NuvioMobile
          fi

          echo "Sao chép các thành phần Gradle và KMP..."
          cp -r /tmp/NuvioMobile/gradle* ../
          cp -r /tmp/NuvioMobile/build.gradle.kts ../
          cp -r /tmp/NuvioMobile/settings.gradle.kts ../
          cp -r /tmp/NuvioMobile/composeApp ../
          cp -r /tmp/NuvioMobile/androidApp ../
          cp -r /tmp/NuvioMobile/store.json ../ 2>/dev/null || true
          cp -r /tmp/NuvioMobile/vendor ../ 2>/dev/null || true
          chmod +x ../gradlew

          echo "Cấu hình settings.gradle.kts cho iOS..."
          python3 -c "p='../settings.gradle.kts'; c=open(p).read(); open(p,'w').write(c.replace('include(\":androidApp\")','// include(\":androidApp\")'))"

          echo "Đồng bộ Configuration sang ../iosApp cho Gradle..."
          mkdir -p ../iosApp
          cp -r Configuration ../iosApp/

          echo "=== 3. Kiểm tra môi trường thư mục cha ==="
          ls -la ../
          ls -la ../iosApp/Configuration

      - name: Build Archive Xcode (Không cần Chứng chỉ - Unsigned)
        script: |
          echo "=== Bắt đầu biên dịch Xcode Archive (Unsigned) ==="
          
          # Thiết lập JAVA_HOME cho Gradle
          if [ -z "$JAVA_HOME" ]; then
            export JAVA_HOME=$(/usr/libexec/java_home -v 17 2>/dev/null || echo "/opt/homebrew/opt/openjdk@17")
          fi
          export PATH="$JAVA_HOME/bin:$PATH"

          # Tối ưu RAM cho Gradle Daemon trên máy ảo Mac Mini (tránh OOM 12GB)
          export GRADLE_OPTS="-Xmx4096M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m"
          export KOTLIN_DAEMON_JVMARGS="-Xmx4096M"

          xcodebuild \
            -project iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Nuvio.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Đóng gói thành file Unsigned IPA
        script: |
          echo "=== Đóng gói IPA ==="
          mkdir -p build/Payload
          cp -r build/Nuvio.xcarchive/Products/Applications/Nuvio.app build/Payload/
          cd build
          zip -qr Nuvio-unsigned.ipa Payload
          echo "=== Đã tạo thành công Nuvio-unsigned.ipa ==="
          ls -lh Nuvio-unsigned.ipa

    artifacts:
      - build/*.ipa
      - build/*.xcarchive
